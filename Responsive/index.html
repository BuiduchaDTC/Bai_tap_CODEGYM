<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Navbar</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Thêm thuộc tính defer để đảm bảo HTML tải xong mới chạy JS -->
    <script defer src="script.js"></script>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">MyWebsite</div>

      <ul class="nav-links">
        <li><a href="#">Trang chủ</a></li>
        <li><a href="#">Giới thiệu</a></li>
        <li><a href="#">Dịch vụ</a></li>
        <li><a href="#">Liên hệ</a></li>
      </ul>

      <!-- Icon Hamburger (sẽ đổi thành dấu X khi mở menu) -->
      <div class="menu-icon">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
    </nav>
  </body>
</html>
