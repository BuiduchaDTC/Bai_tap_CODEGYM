<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Thực hành tạo Menu Ngang</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }

        #menu {
            background-color: #2c3e50;
            height: 50px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        #menu ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        #menu li {
            float: left;
            position: relative;
        }

        #menu a {
            display: block;
            width: 160px;
            height: 50px;
            line-height: 50px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        #menu li:hover>a {
            background-color: #e74c3c;
        }

        #menu ul ul {
            position: absolute;
            top: 50px;
            left: 0;
            visibility: hidden;
            background-color: #34495e;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
            border-radius: 0 0 4px 4px;
        }

        #menu ul ul li {
            float: none;
        }

        #menu ul ul a {
            width: 200px;
            text-align: left;
            padding-left: 20px;
            box-sizing: border-box;
            border-bottom: 1px solid #465c73;
        }

        #menu ul ul li:last-child a {
            border-bottom: none;
        }

        #menu li:hover>ul {
            visibility: visible;
        }
    </style>
</head>

<body>
    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li>
                <a href="#">Quản lý kho</a>
                <ul>
                    <li><a href="#">Phiếu nhập kho</a></li>
                    <li><a href="#">Phiếu xuất kho</a></li>
                    <li><a href="#">Kiểm kê tồn kho</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Quản lý bán hàng</a>
                <ul>
                    <li><a href="#">Danh sách đơn hàng</a></li>
                    <li><a href="#">Thông tin khách hàng</a></li>
                </ul>
            </li>
            <li><a href="#">Báo cáo - Thống kê</a></li>
        </ul>
    </div>
</body>

</html>
