<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang Đăng Ký</title>

    <!-- Nhúng CSS Bootstrap từ CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />

    <!-- Custom CSS để căn giữa form và tạo nền đẹp -->
    <style>
      body {
        background-color: #f0f2f5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .register-card {
        background-color: #ffffff;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        padding: 40px;
        width: 100%;
        max-width: 600px;
      }
      .form-label {
        font-weight: 500;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="register-card">
      <!-- Tiêu đề Form -->
      <div class="text-center mb-5">
        <h2 class="fw-bold text-primary">Tạo Tài Khoản</h2>
        <p class="text-muted">Vui lòng điền thông tin bên dưới để đăng ký</p>
      </div>

      <!-- FORM ĐĂNG KÝ -->
      <form action="#" method="POST">
        <!-- Hàng 1: Họ tên và Email -->
        <div class="row mb-3">
          <div class="col-md-6 mb-3 mb-md-0">
            <label for="fullname" class="form-label"
              >Họ và tên <span class="text-danger">*</span></label
            >
            <input
              type="text"
              class="form-control"
              id="fullname"
              placeholder="Nhập họ và tên..."
              required
            />
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label"
              >Email <span class="text-danger">*</span></label
            >
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="name@example.com"
              required
            />
          </div>
        </div>

        <!-- Hàng 2: Mật khẩu và Xác nhận mật khẩu -->
        <div class="row mb-3">
          <div class="col-md-6 mb-3 mb-md-0">
            <label for="password" class="form-label"
              >Mật khẩu <span class="text-danger">*</span></label
            >
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Tạo mật khẩu..."
              required
            />
          </div>
          <div class="col-md-6">
            <label for="confirmPassword" class="form-label"
              >Xác nhận mật khẩu <span class="text-danger">*</span></label
            >
            <input
              type="password"
              class="form-control"
              id="confirmPassword"
              placeholder="Nhập lại mật khẩu..."
              required
            />
          </div>
        </div>

        <!-- Giới tính (Radio Button) -->
        <div class="mb-3">
          <label class="form-label d-block">Giới tính</label>
          <div class="form-check form-check-inline">
            <input
              class="form-check-input"
              type="radio"
              name="gender"
              id="male"
              value="nam"
              checked
            />
            <label class="form-check-input-label" for="male">Nam</label>
          </div>
          <div class="form-check form-check-inline">
            <input
              class="form-check-input"
              type="radio"
              name="gender"
              id="female"
              value="nu"
            />
            <label class="form-check-input-label" for="female">Nữ</label>
          </div>
          <div class="form-check form-check-inline">
            <input
              class="form-check-input"
              type="radio"
              name="gender"
              id="other"
              value="khac"
            />
            <label class="form-check-input-label" for="other">Khác</label>
          </div>
        </div>

        <!-- Sở thích (Checkbox) -->
        <div class="mb-3">
          <label class="form-label d-block">Sở thích</label>
          <div class="form-check form-check-inline">
            <input
              class="form-check-input"
              type="checkbox"
              id="hobby1"
              value="code"
            />
            <label class="form-check-input-label" for="hobby1">Lập trình</label>
          </div>
          <div class="form-check form-check-inline">
            <input
              class="form-check-input"
              type="checkbox"
              id="hobby2"
              value="design"
            />
            <label class="form-check-input-label" for="hobby2">Thiết kế</label>
          </div>
          <div class="form-check form-check-inline">
            <input
              class="form-check-input"
              type="checkbox"
              id="hobby3"
              value="sport"
            />
            <label class="form-check-input-label" for="hobby3">Thể thao</label>
          </div>
        </div>

        <!-- Quốc gia (Dropdown Select) -->
        <div class="mb-4">
          <label for="country" class="form-label">Quốc gia</label>
          <select class="form-select" id="country">
            <option value="" disabled selected>-- Chọn quốc gia --</option>
            <option value="vn">Việt Nam</option>
            <option value="us">Hoa Kỳ</option>
            <option value="jp">Nhật Bản</option>
            <option value="kr">Hàn Quốc</option>
            <option value="other">Khác</option>
          </select>
        </div>

        <!-- Nút Submit -->
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary btn-lg">
            Đăng Ký Ngay
          </button>
        </div>

        <!-- Text phụ -->
        <div class="text-center mt-4">
          <p class="text-muted small mb-0">
            Bạn đã có tài khoản?
            <a href="#" class="text-decoration-none">Đăng nhập tại đây</a>
          </p>
        </div>
      </form>
    </div>

    <!-- Nhúng JS Bootstrap từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
