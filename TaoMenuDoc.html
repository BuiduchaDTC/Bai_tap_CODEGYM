<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Thực hành tạo Menu Dọc</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        #menu ul,
        #menu li {
            margin: 0;
            padding: 0;
        }

        #menu li {
            list-style: none;
            position: relative;
            width: 100px;
            height: 30px;
            padding: 0 20px;
            background-color: black;
            line-height: 30px;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }

        #menu li a {
            text-decoration: none;
            color: white;
            display: block;
        }

        #menu li:hover {
            background-color: #555;
        }

        #menu li ul {
            position: absolute;
            top: 0;
            left: 160px;
            visibility: hidden;
        }

        #menu li:hover>ul {
            visibility: visible;
        }
    </style>
</head>

<body>
    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li>
                <a href="#">Dịch vụ</a>
                <ul>
                    <li><a href="#">Thiết kế web</a></li>
                    <li><a href="#">SEO Marketing</a></li>
                    <li><a href="#">Tên miền</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Sản phẩm</a>
                <ul>
                    <li><a href="#">Phần mềm</a></li>
                    <li><a href="#">Phần cứng</a></li>
                </ul>
            </li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>
</body>

</html>
