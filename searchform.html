<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <title>Form Tìm kiếm</title>
</head>

<body>
    <h2>Form Tìm kiếm Google</h2>

    <form action="https://www.google.com.vn/search" method="GET">
        <input type="text" name="q" placeholder="Nhập từ khóa" size="40" />
        <input type="submit" value="Tìm kiếm" />
    </form>
    <h2>Form Tìm kiếm Bing</h2>
    <form action="https://www.bing.com/search" method="GET">
        <input type="text" name="q" placeholder="Nhập từ khóa" size="40" />
        <input type="submit" value="Tìm kiếm" />
    </form>

    <h2>Thay đổi get sang post</h2>
    <form action="https://www.google.com.vn/search" method="POST">
        <input type="text" name="q" placeholder="Nhập từ khóa" />
        <input type="submit" value="Tìm kiếm" />
    </form>

</body>

</html>
