<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài viết của tôi</title>
</head>

<body>
    <!-- Tiêu đề chính: màu xanh dương -->
    <h1 style="color: blue;">Bài viết của tôi</h1>

    <!-- Đoạn văn 1: màu đỏ + in đậm -->
    <p style="color: red; font-weight: bold;">
        Đây là đoạn văn được định dạng màu sắc
    </p>

    <!-- Đoạn văn 2: in nghiêng + căn giữa -->
    <p style="font-style: italic; text-align: center;">
        Tôi đang học HTML Styles
    </p>

    <!-- Đoạn văn 3: kích thước 20px + gạch chân -->
    <p style="font-size: 20px; text-decoration: underline;">
        Định dạng văn bản giúp trang web đẹp hơn
    </p>
</body>

</html>
