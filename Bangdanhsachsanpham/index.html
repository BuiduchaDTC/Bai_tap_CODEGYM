<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
</head>

<body>
    <!-- Tiêu đề chính -->
    <h1>Danh sách sản phẩm</h1>

    <!-- Bảng sản phẩm -->
    <table border="1" cellpadding="8" cellspacing="0">
        <!-- Hàng tiêu đề -->
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </tr>

        <!-- Sản phẩm 1 -->
        <tr>
            <td>Điện thoại Samsung Galaxy S24</td>
            <td>25.990.000 VNĐ</td>
            <td>10</td>
        </tr>

        <!-- Sản phẩm 2 -->
        <tr>
            <td>Laptop Dell XPS 13</td>
            <td>32.500.000 VNĐ</td>
            <td>5</td>
        </tr>

        <!-- Sản phẩm 3 -->
        <tr>
            <td>Tai nghe Sony WH-1000XM5</td>
            <td>7.990.000 VNĐ</td>
            <td>20</td>
        </tr>

        <!-- Sản phẩm 4 -->
        <tr>
            <td>Chuột Logitech MX Master 3S</td>
            <td>2.490.000 VNĐ</td>
            <td>15</td>
        </tr>
    </table>
</body>

</html>
