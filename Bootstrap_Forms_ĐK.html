<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang Đăng Ký Người Dùng</title>

    <!-- Nhúng CSS Bootstrap 5 và Font Awesome -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- CSS tùy chỉnh RẤT NHỎ để căn giữa màn hình -->
    <style>
      body {
        background-color: #f4f6f8;
      }
      .register-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
      }
      /* Chỉnh chiều cao ảnh carousel cho vừa vặn */
      .carousel-item img {
        height: 100%;
        min-height: 500px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <!-- Bọc toàn bộ trong Grid Container -->
    <div class="container register-wrapper">
      <div class="row w-100 shadow-lg rounded-4 overflow-hidden bg-white g-0">
        <!-- CỘT TRÁI: CAROUSEL QUẢNG BÁ (Ẩn trên mobile bằng d-none d-md-block) -->
        <div class="col-md-6 d-none d-md-block p-0">
          <div
            id="promoCarousel"
            class="carousel slide h-100"
            data-bs-ride="carousel"
          >
            <!-- Các dấu chấm chuyển slide -->
            <div class="carousel-indicators">
              <button
                type="button"
                data-bs-target="#promoCarousel"
                data-bs-slide-to="0"
                class="active"
              ></button>
              <button
                type="button"
                data-bs-target="#promoCarousel"
                data-bs-slide-to="1"
              ></button>
              <button
                type="button"
                data-bs-target="#promoCarousel"
                data-bs-slide-to="2"
              ></button>
            </div>

            <div class="carousel-inner h-100">
              <!-- Slide 1 -->
              <div class="carousel-item active h-100">
                <img
                  src="https://images.unsplash.com/photo-1552664730-d307ca884978?w=800&q=80"
                  class="d-block w-100"
                  alt="Lợi ích 1"
                />
                <div
                  class="carousel-caption d-flex flex-column justify-content-center h-100 bg-dark bg-opacity-50"
                  style="bottom: 0; top: 0"
                >
                  <h2 class="fw-bold display-5">Tăng Hiệu Suất</h2>
                  <p class="fs-5">
                    Làm việc thông minh hơn với các công cụ đắc lực.
                  </p>
                </div>
              </div>
              <!-- Slide 2 -->
              <div class="carousel-item h-100">
                <img
                  src="https://images.unsplash.com/photo-1553877522-43269d4ea984?w=800&q=80"
                  class="d-block w-100"
                  alt="Lợi ích 2"
                />
                <div
                  class="carousel-caption d-flex flex-column justify-content-center h-100 bg-dark bg-opacity-50"
                  style="bottom: 0; top: 0"
                >
                  <h2 class="fw-bold display-5">Bảo Mật Cao</h2>
                  <p class="fs-5">
                    Dữ liệu của bạn được bảo vệ an toàn tuyệt đối.
                  </p>
                </div>
              </div>
              <!-- Slide 3 -->
              <div class="carousel-item h-100">
                <img
                  src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=800&q=80"
                  class="d-block w-100"
                  alt="Lợi ích 3"
                />
                <div
                  class="carousel-caption d-flex flex-column justify-content-center h-100 bg-dark bg-opacity-50"
                  style="bottom: 0; top: 0"
                >
                  <h2 class="fw-bold display-5">Kết Nối Toàn Cầu</h2>
                  <p class="fs-5">
                    Hợp tác dễ dàng cùng đội ngũ mọi lúc, mọi nơi.
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- CỘT PHẢI: FORM ĐĂNG KÝ -->
        <div class="col-md-6 p-4 p-md-5">
          <div class="text-center mb-5">
            <h2 class="fw-bold text-primary">Tạo Tài Khoản</h2>
            <p class="text-muted">Bắt đầu trải nghiệm dịch vụ ngay hôm nay</p>
          </div>

          <form>
            <!-- Họ tên -->
            <div class="mb-4">
              <label for="fullname" class="form-label fw-medium"
                >Họ và tên</label
              >
              <div class="input-group">
                <span class="input-group-text bg-light"
                  ><i class="fas fa-user text-muted"></i
                ></span>
                <input
                  type="text"
                  class="form-control form-control-lg"
                  id="fullname"
                  placeholder="Nguyễn Văn A"
                  required
                />
              </div>
            </div>

            <!-- Email -->
            <div class="mb-4">
              <label for="email" class="form-label fw-medium">Email</label>
              <div class="input-group">
                <span class="input-group-text bg-light"
                  ><i class="fas fa-envelope text-muted"></i
                ></span>
                <input
                  type="email"
                  class="form-control form-control-lg"
                  id="email"
                  placeholder="name@example.com"
                  required
                />
              </div>
            </div>

            <!-- Mật khẩu -->
            <div class="mb-4">
              <label for="password" class="form-label fw-medium"
                >Mật khẩu</label
              >
              <div class="input-group">
                <span class="input-group-text bg-light"
                  ><i class="fas fa-lock text-muted"></i
                ></span>
                <input
                  type="password"
                  class="form-control form-control-lg"
                  id="password"
                  placeholder="Tạo mật khẩu..."
                  required
                />
              </div>
            </div>

            <!-- Xác nhận mật khẩu -->
            <div class="mb-4">
              <label for="confirmPassword" class="form-label fw-medium"
                >Xác nhận mật khẩu</label
              >
              <div class="input-group">
                <span class="input-group-text bg-light"
                  ><i class="fas fa-shield-alt text-muted"></i
                ></span>
                <input
                  type="password"
                  class="form-control form-control-lg"
                  id="confirmPassword"
                  placeholder="Nhập lại mật khẩu..."
                  required
                />
              </div>
            </div>

            <!-- Checkbox điều khoản -->
            <div class="form-check mb-4">
              <input
                class="form-check-input"
                type="checkbox"
                id="terms"
                required
              />
              <label class="form-check-label text-muted" for="terms">
                Tôi đồng ý với các
                <a href="#" class="text-decoration-none">Điều khoản dịch vụ</a>
                và
                <a href="#" class="text-decoration-none">Chính sách bảo mật</a>.
              </label>
            </div>

            <!-- Nút Submit -->
            <div class="d-grid gap-2 mb-3">
              <button type="submit" class="btn btn-primary btn-lg fw-bold">
                Đăng Ký Ngay
              </button>
            </div>

            <!-- Link đăng nhập -->
            <div class="text-center">
              <p class="text-muted mb-0">
                Đã có tài khoản?
                <a href="#" class="text-decoration-none fw-bold">Đăng nhập</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Nhúng JS Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
