<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bố Cục 3 Cột với Bootstrap</title>

    <!-- Nhúng CSS Bootstrap 5 và Font Awesome -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- Custom CSS -->
    <style>
      /* Chỉnh chiều cao cho ảnh Carousel */
      .carousel-item img {
        height: 400px;
        object-fit: cover;
      }
      /* Làm cho khối 3 cột cao bằng nhau và có hiệu ứng hover */
      .feature-box {
        min-height: 150px;
        border-radius: 8px;
        transition: transform 0.3s ease;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }
      .feature-box:hover {
        transform: translateY(-5px);
      }
    </style>
  </head>
  <body class="bg-light">
    <!-- BƯỚC 1: BỐ CỤC 3 CỘT BẰNG GRID VÀ FLEXBOX -->
    <div class="container mt-5">
      <div class="row g-3">
        <!-- g-3 tạo khoảng cách giữa các cột -->
        <!-- Cột 1 -->
        <div
          class="col-md-4 d-flex justify-content-center align-items-center bg-white p-4 feature-box border"
        >
          <div class="text-center">
            <i class="fas fa-laptop-code text-primary fs-1 mb-2"></i>
            <p class="mb-0 fw-bold">Phần 1</p>
          </div>
        </div>
        <!-- Cột 2 -->
        <div
          class="col-md-4 d-flex justify-content-center align-items-center bg-secondary p-4 text-white feature-box"
        >
          <div class="text-center">
            <i class="fas fa-server fs-1 mb-2"></i>
            <p class="mb-0 fw-bold">Phần 2</p>
          </div>
        </div>
        <!-- Cột 3 -->
        <div
          class="col-md-4 d-flex justify-content-center align-items-center bg-white p-4 feature-box border"
        >
          <div class="text-center">
            <i class="fas fa-mobile-alt text-success fs-1 mb-2"></i>
            <p class="mb-0 fw-bold">Phần 3</p>
          </div>
        </div>
      </div>
    </div>

    <!-- BƯỚC 2: MARGIN & PADDING -->
    <div class="container my-5 py-3">
      <h3 class="text-center fw-bold text-dark">
        <i class="fas fa-arrows-alt-v text-primary"></i>
        Khoảng cách được điều chỉnh bằng Margin & Padding
      </h3>
      <p class="text-center text-muted mt-2">
        Class <code>my-5</code> và <code>py-3</code> giúp tạo khoảng trống rộng
        rãi cho khu vực này.
      </p>
    </div>

    <!-- BƯỚC 3: DISPLAY PROPERTY (Ẩn/Hiện theo màn hình) -->
    <div class="container">
      <div
        class="d-none d-md-block bg-warning text-dark text-center p-3 rounded shadow-sm"
      >
        <p class="mb-0 fw-bold">
          <i class="fas fa-desktop me-2"></i>
          Nội dung này chỉ hiển thị trên màn hình lớn hơn hoặc bằng 768px
          (Tablet/Desktop). Hãy thu nhỏ cửa sổ trình duyệt để thấy nó biến mất!
        </p>
      </div>
    </div>

    <!-- BƯỚC 4: CAROUSEL -->
    <div class="container mt-5">
      <div
        id="myCarousel"
        class="carousel slide rounded overflow-hidden shadow"
        data-bs-ride="carousel"
      >
        <!-- Các dấu chấm chuyển slide -->
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#myCarousel"
            data-bs-slide-to="0"
            class="active"
          ></button>
          <button
            type="button"
            data-bs-target="#myCarousel"
            data-bs-slide-to="1"
          ></button>
          <button
            type="button"
            data-bs-target="#myCarousel"
            data-bs-slide-to="2"
          ></button>
        </div>

        <div class="carousel-inner">
          <div class="carousel-item active">
            <img
              src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1200&q=80"
              class="d-block w-100"
              alt="Hình ảnh 1"
            />
          </div>
          <div class="carousel-item">
            <img
              src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=1200&q=80"
              class="d-block w-100"
              alt="Hình ảnh 2"
            />
          </div>
          <div class="carousel-item">
            <img
              src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=1200&q=80"
              class="d-block w-100"
              alt="Hình ảnh 3"
            />
          </div>
        </div>

        <!-- Nút điều hướng Trái/Phải -->
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#myCarousel"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#myCarousel"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>
    </div>

    <!-- BƯỚC 5 & 6: FORM & FONT AWESOME -->
    <div class="container mt-5 mb-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="bg-white p-4 rounded shadow-sm border">
            <h3 class="text-center mb-4 fw-bold text-primary">
              <i class="fas fa-envelope-open-text"></i> Liên Hệ
            </h3>

            <form>
              <div class="mb-3">
                <label for="name" class="form-label fw-medium">Họ và tên</label>
                <div class="input-group">
                  <span class="input-group-text"
                    ><i class="fas fa-user"></i
                  ></span>
                  <input
                    type="text"
                    class="form-control"
                    id="name"
                    placeholder="Nhập họ và tên"
                  />
                </div>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label fw-medium">Email</label>
                <div class="input-group">
                  <span class="input-group-text"
                    ><i class="fas fa-envelope"></i
                  ></span>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Nhập email"
                  />
                </div>
              </div>

              <div class="mb-3">
                <label for="message" class="form-label fw-medium"
                  >Nội dung</label
                >
                <textarea
                  class="form-control"
                  id="message"
                  rows="4"
                  placeholder="Nhập nội dung..."
                ></textarea>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                  <i class="fas fa-paper-plane me-2"></i> Gửi Tin Nhắn
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Nhúng JS Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
